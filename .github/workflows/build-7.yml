      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK em: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ModForge
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Localizar APK gerado
        run: |
          APK=$(find ModForge -name '*.apk' | head -n 1)
          echo "APK encontrado: $APK"
          test -n "$APK"
          mkdir -p saida
          cp "$APK" saida/ModForge.apk
          ls -lh saida
      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModForge-APK
          path: saida/ModForge.apk
          if-no-files-found: error
      - name: Publicar APK na aba Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "modforge-${{ github.run_number }}-${{ github.run_attempt }}" \
            saida/ModForge.apk \
            --repo "${{ github.repository }}" \
            --title "ModForge APK #${{ github.run_number }}" \
            --notes "APK debug do editor ModForge."
