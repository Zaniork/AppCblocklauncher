              (r"^\.method .*\brakNetConnectCallback\(Ljava/lang/String;I\)V", "invoke-static {p0, p1}, %s->connect(Ljava/lang/String;I)V", "connect"),
          ]
          EXPECTED = ["nativeSetEntityRenderType", "nativeSetMobSkin", "nativeSetCarriedItem", "nativeMobSetArmor",
                      "nativeModelAddBox", "nativeModelClear", "nativeModelSetRotationPoint", "createRenderer",
                      "nativeSpawnEntity", "spawned", "nativeRemoveEntity", "nativeLevelAddParticle",
                      "nativeDefineItem", "nativeAddItemCreativeInv", "nativeSetHandEquipped", "nativeItemSetProperties",
                      "scriptsSempreLigados", "novoMundo+scriptsLigados", "scriptError",
                      "entityAdded", "entityRemoved", "playerAdded", "playerRemoved", "connect"]

          def insert_at_method_start(text, header_re, line, need_free_v0=False):
              lines = text.split("\n")
              for i, ln in enumerate(lines):
                  if re.match(header_re, ln):
                      if need_free_v0:
                          okl = False
                          for q in range(i + 1, min(i + 6, len(lines))):
                              mm = re.match(r"\s*\.locals (\d+)", lines[q])
                              if mm and int(mm.group(1)) >= 1:
                                  okl = True
                          if not okl:
                              return text, False
                      in_ann = False
                      for j in range(i + 1, len(lines)):
                          st = lines[j].strip()
                          if st.startswith(".end method"):
                              return text, False
                          if st.startswith(".annotation"):
                              in_ann = True
                              continue
                          if in_ann:
                              if st.startswith(".end annotation"):
                                  in_ann = False
                              continue
                          if st == "" or st.startswith(".") or st.startswith("#"):
                              continue
                          lines.insert(j, "    " + line)
                          return "\n".join(lines), True
              return text, False

          files = glob.glob("app/smali*/**/*.smali", recursive=True)
          if not files:
              sys.exit("ERRO: nenhum arquivo smali encontrado")

          tick_ok = False
          app_ok = False

          for f in files:
              s = open(f, encoding="utf-8").read()
              orig = s

              for cls, name, params in BEFORE:
                  pat = re.compile(
                      r"^([ \t]*)invoke-static(/range)? (\{[^}]*\}), L%s;->%s\((.*?)\)(.)[ \t]*$"
                      % (re.escape(cls), name), re.M)

                  def rep(m, name=name, params=params):
                      if m.group(4) != params:
                          report.append("IGNORADO %s: descritor %s diferente do esperado %s" % (name, m.group(4), params))
                          return m.group(0)
                      counts[name] = counts.get(name, 0) + 1
                      return "%sinvoke-static%s %s, %s->h_%s(%s)V\n%s" % (
                          m.group(1), m.group(2) or "", m.group(3), H, name, params, m.group(0))

                  s = pat.sub(rep, s)

              # criação de renderizador: hook logo depois do move-result
              pat = re.compile(
                  r"(invoke-static(?:/range)? \{\}, L[^;]+;->\w*[Cc]reateHumanoidRenderer\w*\(\)I[ \t]*\n"
                  r"(?:[ \t]*(?:\.line \d+|#.*)?\n)*[ \t]*move-result ([vp]\d+))")

              def rep2(m):
                  counts["createRenderer"] = counts.get("createRenderer", 0) + 1
                  return "%s\n    invoke-static {%s}, %s->h_rendererCreated(I)V" % (m.group(1), m.group(2), H)

              s = pat.sub(rep2, s)

              # depois de nativeSpawnEntity: captura o id do mob criado (move-result-wide)
              pat3 = re.compile(
                  r"(invoke-static(?:/range)? \{[^}]*\}, L%s;->nativeSpawnEntity\(FFFILjava/lang/String;\)J[ \t]*\n"
                  r"(?:[ \t]*(?:\.line \d+|#.*)?\n)*[ \t]*move-result-wide ([vp])(\d+))" % re.escape(SM))

              def rep3(m):
                  counts["spawned"] = counts.get("spawned", 0) + 1
                  n = int(m.group(3))
                  return "%s\n    invoke-static {%s%d, %s%d}, %s->h_spawned(J)V" % (m.group(1), m.group(2), n, m.group(2), n + 1, H)

              s = pat3.sub(rep3, s)

              # scripts sempre ligados ao entrar em servidor (o launcher desliga se o endereco nao for local)
              pat4 = re.compile(
                  r"(invoke-static(?:/range)? \{[^}]*\}, L%s;->isLocalAddress\(Ljava/lang/String;\)Z[ \t]*\n"
                  r"(?:[ \t]*(?:\.line \d+|#.*)?\n)*[ \t]*move-result ([vp]\d+))" % re.escape(SM))

              def rep4(m):
                  counts["scriptsSempreLigados"] = counts.get("scriptsSempreLigados", 0) + 1
                  return "%s\n    const/16 %s, 0x1" % (m.group(1), m.group(2))

              s = pat4.sub(rep4, s)

              base = os.path.basename(f)
              if base == "ScriptManager.smali":
                  s, ok = insert_at_method_start(
                      s, r"^\.method .*\btickCallback\(\)V", "invoke-static {}, %s->tick()V" % H)
                  tick_ok = tick_ok or ok
                  s, ok3 = insert_at_method_start(
                      s, r"^\.method .*\bsetLevelFakeCallback\(ZZ\)V",
                      "const/4 v0, 0x1\n    sput-boolean v0, L%s;->scriptingEnabled:Z\n    invoke-static {p0, p1}, %s->newLevel(ZZ)V" % (SM, H),
                      need_free_v0=True)
                  if ok3:
                      counts["novoMundo+scriptsLigados"] = counts.get("novoMundo+scriptsLigados", 0) + 1
                  s, ok4 = insert_at_method_start(
                      s, r"^\.method .*\breportScriptError\(L[^;]+;Ljava/lang/Throwable;\)V",
                      "invoke-static {p0, p1}, %s->scriptError(Ljava/lang/Object;Ljava/lang/Throwable;)V" % H)
                  if ok4:
                      counts["scriptError"] = counts.get("scriptError", 0) + 1
                  for hdr, call, label in START_HOOKS:
                      s, okx = insert_at_method_start(s, hdr, call % H)
                      if okx:
                          counts[label] = counts.get(label, 0) + 1
              if base == "BlockLauncher.smali":
                  pat = re.compile(r"^([ \t]*)(invoke-super \{p0\}, Landroid/app/Application;->onCreate\(\)V)[ \t]*$", re.M)
                  s2, n = pat.subn(
                      lambda m: "%s%s\n%sinvoke-static {p0}, %s->app(Landroid/content/Context;)V" % (m.group(1), m.group(2), m.group(1), H), s)
                  if n:
                      s = s2
                      app_ok = True

              if s != orig:
                  open(f, "w", encoding="utf-8").write(s)

          report.append("tick: %s | app: %s" % (tick_ok, app_ok))
          for k in sorted(counts):
              report.append("hook %s: %d ponto(s)" % (k, counts[k]))
          for k in EXPECTED:
              if k not in counts:
                  report.append("AUSENTE (gancho nao encontrado no smali): " + k)
          bi = "\n".join(report)
          esc = bi.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
          os.makedirs("src/net/zhuoweizhang/mcpelauncher", exist_ok=True)
          open("src/net/zhuoweizhang/mcpelauncher/BuildInfo.java", "w").write(
              'package net.zhuoweizhang.mcpelauncher;\npublic class BuildInfo {\n    public static final String VERSION = "v11.3";\n    public static final String REPORT = "' + esc + '";\n}\n')
          open("patch-report.txt", "w").write("\n".join(report) + "\n")
          print("\n".join(report))

          if not tick_ok:
              sys.exit("ERRO: não achei ScriptManager.tickCallback() para ligar o MobSync")
          if counts.get("nativeSetEntityRenderType", 0) == 0 or counts.get("createRenderer", 0) == 0:
              sys.exit("ERRO: pontos principais (render/criação de modelo) não encontrados")
          PY

      - name: Diagnóstico (renderizador)
        run: grep -rn -A2 "HumanoidRenderer" app/smali* | head -30 || true

      - name: Injetar hooks no smali
        run: python3 patch.py

      - name: Escrever fixsdk.py (Android 14/15 exige targetSdk >= 23)
        run: |
          cat > fixsdk.py <<'PY'
          import re, struct, sys

          PATH = "app/AndroidManifest.xml"
          NEW = 23  # minimo que o Android 14/15 aceita instalar

          d = bytearray(open(PATH, "rb").read())

          if d[:1] == b"<":  # manifest em texto (caso o apktool tenha decodificado)
              t = d.decode("utf-8")
              t2, n = re.subn(r'(android:targetSdkVersion=")\d+(")', r"\g<1>%d\2" % NEW, t)
              if n == 0:
                  t2 = t.replace("<uses-sdk", '<uses-sdk android:targetSdkVersion="%d"' % NEW, 1)
              open(PATH, "w", encoding="utf-8").write(t2)
              print("manifest texto: targetSdk ->", NEW)
              sys.exit(0)

          u16 = lambda o: struct.unpack_from("<H", d, o)[0]
          u32 = lambda o: struct.unpack_from("<I", d, o)[0]

          off = 8
          strings = []
          done = False
          while off < len(d) and not done:
              t, sz = u16(off), u32(off + 4)
              if t == 0x0001:
                  sc, flags, so = u32(off + 8), u32(off + 16), u32(off + 20)
                  for i in range(sc):
                      p = off + so + u32(off + 28 + 4 * i)
                      if flags & 0x100:
                          l = d[p]; p += 1
                          if l & 0x80: p += 1
                          l2 = d[p]; p += 1
                          if l2 & 0x80:
                              l2 = ((l2 & 0x7F) << 8) | d[p]; p += 1
                          strings.append(bytes(d[p:p + l2]).decode("utf8", "replace"))
                      else:
                          l = u16(p); p += 2
                          if l & 0x8000:
                              l = ((l & 0x7FFF) << 16) | u16(p); p += 2
                          strings.append(bytes(d[p:p + l * 2]).decode("utf-16le", "replace"))
              elif t == 0x0102 and strings[u32(off + 20)] == "uses-sdk":
                  for i in range(u16(off + 28)):
                      a = off + 36 + 20 * i
                      if strings[u32(a + 4)] == "targetSdkVersion":
                          old = u32(a + 16)
                          struct.pack_into("<I", d, a + 16, NEW)
                          struct.pack_into("<I", d, a + 8, 0xFFFFFFFF)
                          d[a + 15] = 0x10
                          print("targetSdk: %d -> %d" % (old, NEW))
                          done = True
              off += sz

          if not done:
              sys.exit("ERRO: targetSdkVersion nao encontrado no manifest")
          open(PATH, "wb").write(d)
          PY

      - name: Subir targetSdk para 23
        run: python3 fixsdk.py

      - name: Compilar para dex (vira classes2.dex)
        run: |
          ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> $GITHUB_ENV
          mkdir -p classes dexout
          javac --release 8 -Xlint:-options -cp "$ANDROID_JAR" -d classes src/net/zhuoweizhang/mcpelauncher/*.java
          "$BT/d8" --min-api 21 --lib "$ANDROID_JAR" --output dexout $(find classes -name '*.class')
          cp dexout/classes.dex classes2.dex

      - name: Recompilar
        run: |
          java -jar apktool.jar b app -o unsigned.apk
          zip -j unsigned.apk classes2.dex

      - name: Alinhar e assinar
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -keystore release.jks -storepass mobsync123 -keypass mobsync123 \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MobSync"
          fi
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass pass:mobsync123 --key-pass pass:mobsync123 \
            --out editado-mobsync.apk aligned.apk
          "$BT/apksigner" verify editado-mobsync.apk
          "$BT/aapt" dump badging editado-mobsync.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" | tee -a patch-report.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: editado-mobsync-apk
          path: |
            editado-mobsync.apk
            patch-report.txt
