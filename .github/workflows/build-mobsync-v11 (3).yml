name: Build APK com MobSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Mantém a mesma assinatura entre builds (senão toda atualização exigiria desinstalar)
      - name: Restaurar keystore
        uses: actions/cache@v4
        with:
          path: release.jks
          key: keystore-mobsync-v1

      - name: Localizar o APK
        run: |
          APK=$(find . -type f -iname '*.apk' -not -path './.git/*' | head -1)
          if [ -z "$APK" ]; then echo "ERRO: nenhum .apk no repositório"; exit 1; fi
          echo "APK encontrado: $APK"
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Baixar apktool e decompilar (sem mexer nos recursos)
        run: |
          curl -fL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar d -r -f "$APK" -o app
          ls app

      - name: Escrever ModHooks.java
        run: |
          mkdir -p src/net/zhuoweizhang/mcpelauncher
          cat > src/net/zhuoweizhang/mcpelauncher/ModHooks.java <<'JAVA'
          package net.zhuoweizhang.mcpelauncher;

          import android.content.Context;
          import org.json.JSONArray;

          /** Pontos de entrada chamados pelo launcher (inseridos por patch no smali). Nunca lançam exceção. */
          public class ModHooks {
              static boolean asked = false;

              public static void app(Context c) {
                  try { ModBus.ctx = c.getApplicationContext(); } catch (Throwable t) { }
                  try { ModBus.installCrashHandler(); } catch (Throwable t) { }
                  // Android 6+ com targetSdk 23: permissoes precisam ser pedidas em tempo de execucao
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 23 && c instanceof android.app.Application) {
                          ((android.app.Application) c).registerActivityLifecycleCallbacks(
                              new android.app.Application.ActivityLifecycleCallbacks() {
                                  public void onActivityResumed(android.app.Activity a) {
                                      if (asked) return;
                                      asked = true;
                                      try {
                                          java.util.ArrayList<String> need = new java.util.ArrayList<String>();
                                          String[] ps = { "android.permission.WRITE_EXTERNAL_STORAGE", "android.permission.RECORD_AUDIO" };
                                          for (String p : ps) {
                                              if (a.checkSelfPermission(p) != android.content.pm.PackageManager.PERMISSION_GRANTED) need.add(p);
                                          }
                                          if (!need.isEmpty()) a.requestPermissions(need.toArray(new String[0]), 7001);
                                      } catch (Throwable t) { }
                                  }
                                  public void onActivityCreated(android.app.Activity a, android.os.Bundle b) { }
                                  public void onActivityStarted(android.app.Activity a) { }
                                  public void onActivityPaused(android.app.Activity a) { }
                                  public void onActivityStopped(android.app.Activity a) { }
                                  public void onActivitySaveInstanceState(android.app.Activity a, android.os.Bundle b) { }
                                  public void onActivityDestroyed(android.app.Activity a) { }
                              });
                      }
                  } catch (Throwable t) { }
              }

              public static void tick() {
                  try { ModBus.tick(); } catch (Throwable t) { ModBus.log("tick", t); }
              }

              public static void h_rendererCreated(int rid) {
                  try { ModBus.rendererCreated(rid); } catch (Throwable t) { ModBus.log("rendererCreated", t); }
              }

              public static void h_nativeModelAddBox(int r, String part, float x, float y, float z, int w, int h, int d,
                      float scale, int tx, int ty, boolean transparent, float tw, float th) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put("box"); a.put(part);
                      a.put((double) x); a.put((double) y); a.put((double) z);
                      a.put(w); a.put(h); a.put(d);
                      a.put((double) scale);
                      a.put(tx); a.put(ty);
                      a.put(transparent);
                      a.put((double) tw); a.put((double) th);
                      ModBus.rendererOp(r, a);
                  } catch (Throwable t) { ModBus.log("addBox", t); }
              }

              public static void h_nativeModelClear(int r, String part) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put("clr"); a.put(part);
                      ModBus.rendererOp(r, a);
                  } catch (Throwable t) { ModBus.log("clear", t); }
              }

              public static void h_nativeModelSetRotationPoint(int r, String part, float x, float y, float z) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put("rot"); a.put(part);
                      a.put((double) x); a.put((double) y); a.put((double) z);
                      ModBus.rendererOp(r, a);
                  } catch (Throwable t) { ModBus.log("rot", t); }
              }

              public static void h_nativeSetEntityRenderType(long e, int rid) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put(rid);
                      ModBus.onEnt(e, "render", a);
                  } catch (Throwable t) { ModBus.log("render", t); }
              }

              public static void h_nativeSetMobSkin(long e, String skin) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put(skin);
                      ModBus.onEnt(e, "skin", a);
                  } catch (Throwable t) { ModBus.log("skin", t); }
              }

              public static void h_nativeSetCarriedItem(long e, int id, int count, int dmg) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put(id); a.put(count); a.put(dmg);
                      ModBus.onEnt(e, "carry", a);
                  } catch (Throwable t) { ModBus.log("carry", t); }
              }

              public static void h_nativeMobSetArmor(long e, int slot, int id, int dmg) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put(slot); a.put(id); a.put(dmg);
                      ModBus.onEnt(e, "armor" + slot, a);
                  } catch (Throwable t) { ModBus.log("armor", t); }
              }

              public static void h_nativeSpawnEntity(float x, float y, float z, int type, String skin) {
                  try { ModBus.spawnArgs(x, y, z, type, skin); } catch (Throwable t) { }
              }

              public static void h_spawned(long id) {
                  try { ModBus.spawned(id); } catch (Throwable t) { ModBus.log("spawned", t); }
              }

              public static void h_nativeRemoveEntity(long e) {
                  try { ModBus.removed(e); } catch (Throwable t) { ModBus.log("removed", t); }
              }

                  static void item(String n, int id, Object... v) {
                  try {
                      JSONArray a = new JSONArray();
                      a.put(n);
                      a.put(id);
                      for (Object o : v) a.put(o);
                      ModBus.itemOp(n, id, a);
                  } catch (Throwable t) { ModBus.log("item", t); }
              }

              public static void scriptError(Object state, Throwable t) {
                  try { ModBus.scriptError(state, t); } catch (Throwable x) { }
              }

              public static void newLevel(boolean hasLevel, boolean remote) {
                  try { ModBus.newLevel(hasLevel, remote); } catch (Throwable t) { ModBus.log("newLevel", t); }
              }
          
              public static void entityAdded(long e) {
                  try { ModBus.onEntityAdded(e); } catch (Throwable t) { }
              }
          
              public static void entityRemoved(long e) {
                  try { ModBus.onEntityRemoved(e); } catch (Throwable t) { }
              }
          
              public static void playerAdded(long e) {
                  try { ModBus.onPlayerAdded(e); } catch (Throwable t) { }
              }
          
              public static void playerRemoved(long e) {
                  try { ModBus.onPlayerRemoved(e); } catch (Throwable t) { }
              }
          
              public static void connect(String host, int port) {
                  try { ModBus.onConnect(host, port); } catch (Throwable t) { }
              }

              public static void h_nativeDefineItem(int id, String icon, int sub, String name, int max) {
                  item("nativeDefineItem", id, icon, Integer.valueOf(sub), name, Integer.valueOf(max));
              }

              public static void h_nativeDefineSnowballItem(int id, String icon, int sub, String name, int max) {
                  item("nativeDefineSnowballItem", id, icon, Integer.valueOf(sub), name, Integer.valueOf(max));
              }

              public static void h_nativeDefineArmor(int id, String icon, int sub, String name, String tex, int a, int b, int c) {
                  item("nativeDefineArmor", id, icon, Integer.valueOf(sub), name, tex, Integer.valueOf(a), Integer.valueOf(b), Integer.valueOf(c));
              }

              public static void h_nativeItemSetProperties(int id, String json) {
                  item("nativeItemSetProperties", id, json);
              }

              public static void h_nativeSetHandEquipped(int id, boolean v) {
                  item("nativeSetHandEquipped", id, Boolean.valueOf(v));
              }

              public static void h_nativeSetItemCategory(int id, int cat, int x) {
                  item("nativeSetItemCategory", id, Integer.valueOf(cat), Integer.valueOf(x));
              }

              public static void h_nativeSetItemMaxDamage(int id, int dmg) {
                  item("nativeSetItemMaxDamage", id, Integer.valueOf(dmg));
              }

              public static void h_nativeItemSetUseAnimation(int id, int anim) {
                  item("nativeItemSetUseAnimation", id, Integer.valueOf(anim));
              }

              public static void h_nativeItemSetStackedByData(int id, boolean v) {
                  item("nativeItemSetStackedByData", id, Boolean.valueOf(v));
              }

              public static void h_nativeAddItemCreativeInv(int id, int count, int dmg) {
                  try { ModBus.creativeAdded(id, count, dmg); } catch (Throwable t) { ModBus.log("creativo", t); }
              }

              public static void h_nativeLevelAddParticle(int type, float x, float y, float z, float vx, float vy, float vz, int size) {
                  try { ModBus.particle(type, x, y, z, vx, vy, vz, size); } catch (Throwable t) { }
              }
          }
          JAVA

      - name: Escrever ModBus.java
        run: |
          cat > src/net/zhuoweizhang/mcpelauncher/ModBus.java <<'JAVA'
          package net.zhuoweizhang.mcpelauncher;

          import android.content.Context;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.Toast;
          import java.io.BufferedReader;
          import java.io.FileReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.PrintWriter;
          import java.io.StringWriter;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.InterfaceAddress;
          import java.net.NetworkInterface;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Enumeration;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.LinkedHashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.LinkedBlockingQueue;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /**
           * MobSync v3: replica entre aparelhos na mesma rede o que os mods fazem de visual:
           * modelo 3D, skin, item na mao, armadura, particulas e mobs criados so no cliente (viram "fantasmas" no host).
           * Tudo e aplicado na thread do jogo (dentro do tick).
           */
          public class ModBus {
              static final String TAG = "ModSync";
              static final int PORT = 19147;
              static final String ID = UUID.randomUUID().toString().substring(0, 8);
              static final String SM = "net.zhuoweizhang.mcpelauncher.ScriptManager";
              static final String RM = "net.zhuoweizhang.mcpelauncher.api.modpe.RendererManager";

              /** Os IDs de entidade deste launcher sao NEGATIVOS (ex.: -4294967295): nunca usar >0 ou <0 como teste de validade. */
              static final long NONE = Long.MIN_VALUE;
              static int epoch = 0;

              static Context ctx;
              static boolean started = false;
              static boolean replaying = false;
              static int tickN = 0;
              static int opCount = 0;
              static int rxOps = 0;
              static final Object lock = new Object();

              // ---- estado local (o que ESTE aparelho fez)
              static final LinkedHashMap<Integer, ArrayList<JSONArray>> rdefs = new LinkedHashMap<Integer, ArrayList<JSONArray>>();
              static final HashMap<String, EntState> ents = new HashMap<String, EntState>();
              static final HashMap<Long, Own> own = new HashMap<Long, Own>(); // so thread do jogo
              static final ArrayList<double[]> pq = new ArrayList<double[]>(); // particulas pendentes (thread do jogo)
              static float pX, pY, pZ;
              static int pType;
              static String pSkin;

              // ---- rede
              static final ArrayList<Peer> peers = new ArrayList<Peer>();
              static final HashSet<String> connecting = new HashSet<String>();
              static final ConcurrentLinkedQueue<Msg> inbox = new ConcurrentLinkedQueue<Msg>();
              static final ConcurrentLinkedQueue<String> goneQ = new ConcurrentLinkedQueue<String>();
              static final ConcurrentLinkedQueue<Peer> snapQ = new ConcurrentLinkedQueue<Peer>();

              // ---- estado recebido (o que OUTROS aparelhos fizeram) - so thread do jogo
              static final HashMap<String, Integer> rmap = new HashMap<String, Integer>();
              static final HashMap<String, Integer> minRid = new HashMap<String, Integer>();
              static int curTries = 0;
              static final HashMap<String, Group> remote = new HashMap<String, Group>();
              static final HashMap<String, Long> gmap = new HashMap<String, Long>();
              static final HashSet<Long> myGhosts = new HashSet<Long>();
              static final HashSet<Long> hidden = new HashSet<Long>();
              static final HashMap<String, Long> uuidCache = new HashMap<String, Long>();
              static final HashMap<String, Method> mcache = new HashMap<String, Method>();
              static int invisRid = -1;
              static final LinkedHashMap<Integer, ArrayList<JSONArray>> itemOps = new LinkedHashMap<Integer, ArrayList<JSONArray>>();
              static final ArrayList<JSONArray> creativeList = new ArrayList<JSONArray>();
              static final HashSet<Integer> remoteItems = new HashSet<Integer>();
              static final HashSet<String> creativeApplied = new HashSet<String>();
              static final HashMap<String, Boolean> cfg = new HashMap<String, Boolean>();
              static final HashMap<String, Integer> counters = new HashMap<String, Integer>();
              static final HashMap<String, Integer> limited = new HashMap<String, Integer>();
              static java.lang.reflect.Field allPlayers;
              static int lastUuidScan = -100;
              static java.lang.reflect.Field allEntities;
              static boolean toastedApply = false;
              // ids de mobs criados SO neste aparelho (mundo de outro host) que coincidem com o id de outra entidade (jogadores!)
              static final HashSet<Long> collided = new HashSet<Long>();
              static final LinkedHashSet<Long> restoreQ = new LinkedHashSet<Long>();
              static HashSet<Long> preSpawn = null;
              static long lastLocalId = NONE; // ultimo id que o contador LOCAL de entidades entregou
              static java.lang.reflect.Method spawnM = null;
              static int burned = 0;
              static final HashMap<Long, Object[]> saved = new HashMap<Long, Object[]>(); // modelo/skin que a entidade tinha ANTES de um mob local colidir com ela

              static class EntState {
                  int born;
                  int ty;
                  long pid = NONE;
                  HashMap<String, JSONArray> m = new HashMap<String, JSONArray>();
              }

              static class Own {
                  int type;
                  String skin;
                  boolean seen;
                  int born;
                  float x, y, z, yaw, pitch;
              }

              static class Group {
                  String peer;
                  String target;
                  long pid = NONE;
                  HashMap<String, Remote> m = new HashMap<String, Remote>();
              }

              static class Remote {
                  int ty;
                  JSONArray a;
                  boolean done;
                  int tries;
                  int born;
              }

              static class Msg {
                  Peer p;
                  JSONObject j;
              }

              static class Peer {
                  final Socket s;
                  final String id;
                  final LinkedBlockingQueue<String> out = new LinkedBlockingQueue<String>();
                  final HashSet<String> fresh = new HashSet<String>();
                  volatile boolean dead = false;

                  Peer(Socket s, String id) {
                      this.s = s;
                      this.id = id;
                  }

                  void start() {
                      final Peer self = this;
                      Thread w = new Thread(new Runnable() {
                          public void run() {
                              try {
                                  OutputStream os = s.getOutputStream();
                                  while (!dead) {
                                      String line = out.take();
                                      os.write((line + "\n").getBytes("UTF-8"));
                                      os.flush();
                                  }
                              } catch (Throwable t) {
                                  tr("REDE", "thread do peer " + id + " terminou: " + t, 10);
                              }
                              self.close();
                          }
                      });
                      w.setDaemon(true);
                      w.start();
                      Thread r = new Thread(new Runnable() {
                          public void run() {
                              try {
                                  BufferedReader br = new BufferedReader(new InputStreamReader(s.getInputStream(), "UTF-8"));
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      try {
                                          Msg m = new Msg();
                                          m.p = self;
                                          m.j = new JSONObject(line);
                                          String mt = m.j.getString("t");
                                          if (inbox.size() > 40000 && !(mt.equals("r") || mt.equals("o") || mt.equals("i"))) {
                                              continue; // fila cheia: descarta so efeitos
                                          }
                                          inbox.add(m);
                                      } catch (Throwable t) {
                                          log("json", t);
                                      }
                                  }
                              } catch (Throwable t) {
                                  tr("REDE", "thread do peer " + id + " terminou: " + t, 10);
                              }
                              self.close();
                          }
                      });
                      r.setDaemon(true);
                      r.start();
                  }

                  void close() {
                      if (dead) return;
                      dead = true;
                      try { s.close(); } catch (Throwable t) { }
                      synchronized (peers) { peers.remove(this); }
                      try {
                          Msg bye = new Msg();
                          bye.p = this;
                          bye.j = new JSONObject();
                          bye.j.put("t", "bye");
                          inbox.add(bye); // mesma fila das mensagens: o "bye" sempre e processado ANTES de qualquer mensagem de uma conexao nova
                      } catch (Throwable t) { }
                      dbg("peer desconectado " + id);
                      toast("ModSync: aparelho desconectado");
                  }
              }

              // ------------------------------------------------------------------ utilidades

              static void log(String m, Throwable t) {
                  try { Log.w(TAG, m + ": " + t); } catch (Throwable x) { }
                  tr("ERRO", m + ": " + stack(t), 20);
                  dbg("ERRO " + m + ": " + t);
              }

              static File dir() {
                  try {
                      File d = ctx.getExternalFilesDir(null);
                      if (d == null) d = ctx.getFilesDir();
                      File x = new File(d, "modsync");
                      x.mkdirs();
                      return x;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              // ======================= TRACE: diario detalhado (trace.txt, trace.prev.txt, report.txt) =======================
              static final long T0 = System.currentTimeMillis();
              static final Object traceLock = new Object();
              static final ArrayDeque<String> ring = new ArrayDeque<String>();
              static final HashMap<String, long[]> rate = new HashMap<String, long[]>();
              static FileOutputStream traceOut;
              static long traceBytes = 0;
              static boolean traceOpened = false;
              static String lastStatus = "";
              static String prevLast = "";
              static long tickNsMax = 0, tickNsSum = 0;
              static int tickCount = 0;
              static final HashMap<Integer, int[]> opsPerRid = new HashMap<Integer, int[]>();
              static final HashMap<String, Long> lastRes = new HashMap<String, Long>();
              static final HashMap<Long, String> lastOther = new HashMap<Long, String>();
              static int lastHandId = Integer.MIN_VALUE;

              /** Escreve uma linha no trace. Cada categoria tem limite por segundo; o excesso vira uma linha de resumo. */
              static void tr(String cat, String msg, int perSec) {
                  try {
                      long now = System.currentTimeMillis();
                      synchronized (traceLock) {
                          long sec = now / 1000L;
                          long[] r = rate.get(cat);
                          if (r == null) {
                              r = new long[3];
                              rate.put(cat, r);
                          }
                          if (r[0] != sec) {
                              if (r[2] > 0) emit(now, cat, "(" + r[2] + " linhas suprimidas no segundo anterior)");
                              r[0] = sec;
                              r[1] = 0;
                              r[2] = 0;
                          }
                          r[1]++;
                          if (r[1] > perSec) {
                              r[2]++;
                              return;
                          }
                          emit(now, cat, msg);
                      }
                  } catch (Throwable t) { }
              }

              static void tr(String cat, String msg) {
                  tr(cat, msg, 40);
              }

              static void emit(long now, String cat, String msg) throws Exception {
                  String line = (now - T0) + " t" + tickN + " [" + Thread.currentThread().getName() + "] " + cat + " " + msg + "\n";
                  ring.addLast(line);
                  if (ring.size() > 600) ring.removeFirst();
                  if (!traceOpened) openTrace();
                  if (traceOut != null) {
                      byte[] b = line.getBytes("UTF-8");
                      traceOut.write(b); // sem buffer: o que foi escrito sobrevive a um travamento do jogo
                      traceBytes += b.length;
                      if (traceBytes > 2500000L) rotateTrace();
                  }
              }

              static void openTrace() {
                  File d = dir();
                  if (d == null) return; // sem contexto ainda: por enquanto so fica na memoria
                  traceOpened = true;
                  try {
                      File f = new File(d, "trace.txt");
                      if (f.exists()) {
                          File prev = new File(d, "trace.prev.txt");
                          if (prev.exists()) prev.delete();
                          f.renameTo(prev);
                      }
                      traceOut = new FileOutputStream(new File(d, "trace.txt"), false);
                      traceBytes = 0;
                  } catch (Throwable t) {
                      traceOut = null;
                  }
              }

              static void rotateTrace() {
                  try {
                      traceOut.close();
                      File d = dir();
                      File f = new File(d, "trace.txt");
                      File old = new File(d, "trace.1.txt");
                      if (old.exists()) old.delete();
                      f.renameTo(old);
                      traceOut = new FileOutputStream(new File(d, "trace.txt"), false);
                      traceBytes = 0;
                  } catch (Throwable t) {
                      traceOut = null;
                  }
              }

              static String cut(String s, int n) {
                  return s.length() <= n ? s : s.substring(0, n) + "...";
              }

              static String stack(Throwable t) {
                  StringBuilder sb = new StringBuilder(String.valueOf(t));
                  try {
                      StackTraceElement[] st = t.getStackTrace();
                      for (int i = 0; i < st.length && i < 8; i++) sb.append("\n    at ").append(st[i]);
                  } catch (Throwable x) { }
                  return sb.toString();
              }

              static String mem() {
                  Runtime r = Runtime.getRuntime();
                  return "mem_usada=" + ((r.totalMemory() - r.freeMemory()) >> 20) + "MB mem_max=" + (r.maxMemory() >> 20) + "MB threads=" + Thread.activeCount();
              }

              /** Um unico arquivo para me mandar: cabecalho + estado + ultimas ~600 linhas do trace. Reescrito a cada 30 s e no travamento. */
              static void writeReport(String why) {
                  try {
                      File d = dir();
                      if (d == null) return;
                      StringBuilder sb = new StringBuilder();
                      sb.append("=== RELATORIO MobSync (").append(why).append(") ===\n");
                      sb.append("versao=").append(BuildInfo.VERSION).append(" id=").append(ID).append(" t=").append(System.currentTimeMillis() - T0).append("ms tick=").append(tickN).append("\n");
                      sb.append("aparelho=").append(Build.MODEL).append(" android=").append(Build.VERSION.RELEASE).append(" sdk=").append(Build.VERSION.SDK_INT).append("\n");
                      try { sb.append("pacote=").append(ctx.getPackageName()).append("\n"); } catch (Throwable t) { }
                      sb.append("config=").append(cfg).append("\n");
                      sb.append("ganchos aplicados neste APK:\n").append(BuildInfo.REPORT).append("\n");
                      sb.append("ultima operacao da sessao anterior=").append(prevLast).append("\n");
                      sb.append("ultimo_status=").append(lastStatus).append("\n");
                      sb.append("--- ultimas linhas do trace ---\n");
                      synchronized (traceLock) {
                          for (String l : ring) sb.append(l);
                      }
                      FileOutputStream o = new FileOutputStream(new File(d, "report.txt"), false);
                      o.write(sb.toString().getBytes("UTF-8"));
                      o.close();
                  } catch (Throwable t) { }
              }

              static void startSession() {
                  try {
                      File d = dir();
                      if (d != null) {
                          File lf = new File(d, "last.txt");
                          if (lf.exists()) {
                              java.io.FileInputStream in = new java.io.FileInputStream(lf);
                              byte[] b = new byte[(int) Math.min(lf.length(), 400L)];
                              int n = in.read(b);
                              in.close();
                              prevLast = new String(b, 0, Math.max(n, 0), "UTF-8");
                          }
                      }
                  } catch (Throwable t) { }
                  loadCfg();
                  tr("SESSAO", "MobSync " + BuildInfo.VERSION + " id=" + ID + " aparelho=" + Build.MODEL + " android=" + Build.VERSION.RELEASE + " sdk=" + Build.VERSION.SDK_INT, 100);
                  tr("SESSAO", "config=" + cfg + " " + mem(), 100);
                  tr("SESSAO", "ultima operacao da sessao anterior (last.txt)=" + prevLast, 100);
                  for (String l : BuildInfo.REPORT.split("\\n")) tr("PATCH", l, 200);
              }

