              static void pollOther() throws Exception {
                  long me = playerEnt();
                  HashSet<Long> others = new HashSet<Long>();
                  try {
                      if (allPlayers == null) allPlayers = Class.forName(SM).getField("allplayers");
                      List<?> ap = (List<?>) allPlayers.get(null);
                      if (ap != null) {
                          for (Object o : new ArrayList<Object>(ap)) {
                              long id = ((Long) o).longValue();
                              if (id != me) others.add(Long.valueOf(id));
                          }
                      }
                  } catch (Throwable t) { }
                  for (Group g : new ArrayList<Group>(remote.values())) {
                      if (g.pid != NONE && g.pid != me) others.add(Long.valueOf(g.pid));
                  }
                  for (Long id : others) {
                      long i = id.longValue();
                      int ty = typeOf(i);
                      String item = "?";
                      if (ty == 63 || present(i)) {
                          try {
                              item = smCall("nativeEntityGetCarriedItem", id, Integer.valueOf(0)) + "/" + smCall("nativeEntityGetCarriedItem", id, Integer.valueOf(1)) + "/" + smCall("nativeEntityGetCarriedItem", id, Integer.valueOf(2));
                          } catch (Throwable t) { item = "erro"; }
                      }
                      String st = "tipo=" + ty + " presente_na_lista=" + present(i) + " item_que_o_jogo_mostra(id/dmg/qtd)=" + item;
                      String old = lastOther.get(id);
                      if (!st.equals(old)) {
                          lastOther.put(id, st);
                          tr("OUTRO-JOGADOR", "id=" + i + " " + st, 30);
                      }
                  }
              }

              /** Ultima operacao feita (sobrescreve): se o jogo fechar de repente, este arquivo mostra o que estava rodando. */
