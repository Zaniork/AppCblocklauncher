              static void installCrashHandler() {
                  try {
                      final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          public void uncaughtException(Thread t, Throwable e) {
                              try {
                                  StringWriter sw = new StringWriter();
                                  e.printStackTrace(new PrintWriter(sw));
                                  File d = dir();
                                  if (d != null) {
                                      FileOutputStream o = new FileOutputStream(new File(d, "crash.txt"), true);
                                      o.write(("=== tick " + tickN + " thread " + t.getName() + "\n" + sw.toString() + "\n").getBytes("UTF-8"));
                                      o.close();
                                  }
                              } catch (Throwable x) { }
                              try { tr("CRASH", stack(e), 5); writeReport("CRASH " + e); } catch (Throwable x) { }
                              if (old != null) old.uncaughtException(t, e);
                          }
                      });
                  } catch (Throwable t) { }
              }

              static void toast(final String msg) {
                  try {
                      final Context c = ctx;
                      if (c == null) return;
                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          public void run() {
                              try { Toast.makeText(c, msg, Toast.LENGTH_LONG).show(); } catch (Throwable t) { }
                          }
                      });
                  } catch (Throwable t) { }
              }

              static Method find(Class<?> c, String name, int arity) throws Exception {
                  String k = c.getName() + "#" + name + "/" + arity;
                  Method m = mcache.get(k);
                  if (m != null) return m;
                  for (Method x : c.getDeclaredMethods()) {
                      if (x.getName().equals(name) && x.getParameterTypes().length == arity) {
                          x.setAccessible(true);
                          mcache.put(k, x);
                          return x;
                      }
                  }
                  throw new NoSuchMethodException(k);
              }

              static Object invoke(Class<?> c, String name, Object... args) throws Exception {
                  Method m = find(c, name, args.length);
                  try {
                      return m.invoke(null, args);
                  } catch (InvocationTargetException ite) {
                      throw new Exception(String.valueOf(ite.getCause()));
                  }
              }

              static Object smCall(String name, Object... args) throws Exception {
                  return invoke(Class.forName(SM), name, args);
              }

              static Object rmCall(String name, Object... args) throws Exception {
                  return invoke(Class.forName(RM), name, args);
              }

              static boolean isRemote() {
                  try {
                      if (Class.forName(SM).getField("isRemote").getBoolean(null)) return true;
                  } catch (Throwable t) { }
                  try { return ((Boolean) smCall("nativeLevelIsRemote")).booleanValue(); } catch (Throwable t) { return false; }
              }

              static long playerEnt() {
                  try { return ((Long) smCall("nativeGetPlayerEnt")).longValue(); } catch (Throwable t) { return NONE; }
              }

              static boolean present(long e) {
                  try {
                      if (allEntities == null) {
                          allEntities = Class.forName(SM).getField("allentities");
                      }
                      List<?> l = (List<?>) allEntities.get(null);
                      return l != null && l.contains(Long.valueOf(e));
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Mundo carregado e jogador presente. Fora disso nenhuma chamada nativa e feita (era um risco de travamento ao entrar/sair). */
              static boolean ready() {
                  long pe = playerEnt();
                  return pe != NONE && present(pe);
              }

              static boolean isPlayer(long e) {
                  try {
                      Object r = invoke(Class.forName(SM + "$NativePlayerApi"), "isPlayer", Long.valueOf(e));
                      return r instanceof Boolean && ((Boolean) r).booleanValue();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Entidade que e jogador por qualquer fonte: lista de jogadores do launcher ou id informado por um aparelho remoto. */
              static boolean isKnownPlayer(long e) {
                  try {
                      if (allPlayers == null) allPlayers = Class.forName(SM).getField("allplayers");
                      List<?> ap = (List<?>) allPlayers.get(null);
                      if (ap != null && ap.contains(Long.valueOf(e))) return true;
                  } catch (Throwable t) { }
                  for (Group g : new ArrayList<Group>(remote.values())) {
                      if (g.target.startsWith("p:") && g.pid == e) return true;
                  }
                  return false;
              }
              static String uuidOf(long e) {
                  try {
                      Object o = smCall("nativeEntityGetUUID", Long.valueOf(e));
                      if (!(o instanceof long[])) return null;
                      long[] a = (long[]) o;
                      if (a.length < 2 || (a[0] == 0 && a[1] == 0)) return null;
                      return Long.toHexString(a[0]) + "-" + Long.toHexString(a[1]);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              static int typeOf(long e) {
                  try {
                      Object r = invoke(Class.forName(SM + "$NativeEntityApi"), "getEntityTypeId", Long.valueOf(e));
                      return r instanceof Integer ? ((Integer) r).intValue() : -1;
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              static String nameOf(long e) {
                  try {
                      Object r = smCall("nativeGetPlayerName", Long.valueOf(e));
                      return r == null ? null : String.valueOf(r);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              static String playerKey(long e) {
                  String u = uuidOf(e);
                  if (u != null) return u;
                  String n = nameOf(e);
                  return n != null ? "n-" + n : "?";
              }

              /** Identifica a entidade de um jeito que vale nos dois aparelhos. */
              static String targetOf(long e) {
                  long pe = playerEnt();
                  if (collided.contains(Long.valueOf(e))) {
                      Own oc = own.get(Long.valueOf(e));
                      if (oc != null && tickN - oc.born <= 4) return "o:" + e; // o mod configura o mob logo depois de cria-lo
                  }
                  if (pe != NONE && e == pe) return "p:" + playerKey(e);
                  if (own.containsKey(Long.valueOf(e))) return "o:" + e;
                  return "e:" + e;
              }

              // ------------------------------------------------------------------ registro local (chamado pelos hooks)

              static void rendererCreated(int rid) throws Exception {
                  synchronized (lock) {
                      rdefs.put(Integer.valueOf(rid), new ArrayList<JSONArray>());
                  }
                  opsPerRid.put(Integer.valueOf(rid), new int[1]);
                  tr("MODELO", "renderer criado rid=" + rid + " (peers=" + peers.size() + ")", 30);
                  broadcast(rMsg(rid));
              }

              static void rendererOp(int rid, JSONArray op) throws Exception {
                  synchronized (lock) {
                      ArrayList<JSONArray> l = rdefs.get(Integer.valueOf(rid));
                      if (l == null || opCount > 300000) return;
                      l.add(op);
                      opCount++;
                      int[] oc = opsPerRid.get(Integer.valueOf(rid));
                      if (oc != null) oc[0]++;
                      if ((opCount & 255) == 0) bump("hook:modelo256");
                  }
                  broadcast(oMsg(rid, op));
              }

              static void onEnt(long e, String k, JSONArray a) throws Exception {
                  if (replaying || !on("master")) return;
                  String t = targetOf(e);
                  boolean pl = t.startsWith("p:");
                  if ((k.equals("render") || k.equals("skin")) && t.startsWith("o:") && collided.contains(Long.valueOf(e)) && onDef("protegerjogador", true)) {
                      restoreQ.add(Long.valueOf(e)); // o nativo vai gravar isto na entidade que divide o id: restauramos no proximo tick

                    if (!saved.containsKey(Long.valueOf(e))) {
                        try {
                            Object rr = smCall("nativeEntityGetRenderType", Long.valueOf(e));
                            Object ss = smCall("nativeEntityGetMobSkin", Long.valueOf(e));
                            saved.put(Long.valueOf(e), new Object[] { rr, ss });
                        } catch (Throwable ignorado) { }
                    }
                  }
                  if (pl && !on("players")) return;
                  if (!pl && !on("entities")) return;
                  bump("hook:" + k + (pl ? ":jogador" : ":mob"));
                  int ty = pl ? 0 : typeOf(e);
                  if (!pl && (ty == 63 || isPlayer(e))) { bump("hook:ignorado-jogador-remoto"); return; }
                  synchronized (lock) {
                      EntState st = ents.get(t);
                      if (st == null) {
                          st = new EntState();
                          st.born = tickN;
                          st.ty = ty;
                          if (pl) st.pid = e;
                          ents.put(t, st);
                      }
                      JSONArray old = st.m.get(k);
                      if (old != null && old.toString().equals(a.toString())) {
                          bump("dedupe:" + k);
                          return;
                      }
                      st.m.put(k, a);
                  }
                  String extra = "";
                  if (k.equals("render")) {
                      int[] oc = opsPerRid.get(Integer.valueOf(a.getInt(0)));
                      extra = " modelo_ops=" + (oc == null ? "desconhecido(vanilla?)" : String.valueOf(oc[0]));
                  }
                  tr("HOOK", "id=" + e + " alvo=" + t + " k=" + k + " a=" + a + " tipo=" + ty + extra + " peers=" + peers.size(), 60);
                  broadcast(eMsg(t, k, a, ty, pl ? e : NONE));
              }

              static void itemOp(String name, int id, JSONArray op) throws Exception {
                  if (replaying || !on("items") || !on("master")) return;
                  synchronized (lock) {
                      ArrayList<JSONArray> l = itemOps.get(Integer.valueOf(id));
                      if (l == null) {
                          l = new ArrayList<JSONArray>();
                          itemOps.put(Integer.valueOf(id), l);
                      }
                      l.add(op);
                  }
                  tr("ITEM", "definicao " + cut(op.toString(), 200), 50);
                  bump("hook:item");
                  broadcast(iMsg(op));
              }

              static void creativeAdded(int id, int count, int dmg) throws Exception {
                  if (replaying || !on("items") || !on("master")) return;
                  JSONArray a = new JSONArray();
                  a.put(id);
                  a.put(count);
                  a.put(dmg);
                  creativeApplied.add(id + ":" + dmg); // este aparelho ja adicionou (neste mundo)
                  tr("ITEM", "criativo id=" + id + " qtd=" + count + " dmg=" + dmg, 50);
                  synchronized (lock) { creativeList.add(a); }
                  bump("hook:criativo");
                  broadcast(cMsg(a));
              }

              /** Chamado no inicio de cada mundo novo: ids de entidade recomecam, entao o estado por entidade e descartado. */
              /** O launcher desliga um script apos 5 erros. Aqui registramos cada erro (nome, mensagem e onde) e, se keepalive=1, zeramos o contador. */
              static void scriptError(Object state, Throwable t) {
                  String name = "?";
                  int errs = -1;
                  try {
                      java.lang.reflect.Field fn = state.getClass().getDeclaredField("name");
                      fn.setAccessible(true);
                      name = String.valueOf(fn.get(state));
                      java.lang.reflect.Field fe = state.getClass().getDeclaredField("errors");
                      fe.setAccessible(true);
                      errs = fe.getInt(state) + 1;
                      if (onDef("keepalive", false)) fe.setInt(state, 0);
                  } catch (Throwable x) { }
                  bump("erroDeScript");
                  String top = "";
                  try {
                      StackTraceElement[] st = t.getStackTrace();
                      if (st.length > 0) top = st[0].toString();
                  } catch (Throwable x) { }
                  dbgN("scripterr", "ERRO DE SCRIPT '" + name + "' (n=" + errs + "): " + t + " @ " + top, 60);
              }

              static void newLevel(boolean hasLevel, boolean remoteLevel) {
                  tr("MUNDO", "setLevelFakeCallback hasLevel=" + hasLevel + " mundo_remoto=" + remoteLevel + " epoca=" + (epoch + 1) + " eu=" + playerEnt(), 20);
                  epoch++;
                  creativeApplied.clear();
                  gmap.clear();
                  myGhosts.clear();
                  hidden.clear();
                  own.clear();
                  collided.clear();
                  restoreQ.clear();
                  saved.clear();
                  preSpawn = null;
                  lastLocalId = NONE;
                  pq.clear();
                  synchronized (lock) {
                      Iterator<Map.Entry<String, EntState>> it = ents.entrySet().iterator();
                      while (it.hasNext()) {
                          if (!it.next().getKey().startsWith("p:")) it.remove();
                      }
                      // o mod recria a lista do criativo a cada mundo: guardamos so a mais recente
                      creativeList.clear();
                  }
                  Iterator<Map.Entry<String, Group>> gi = remote.entrySet().iterator();
                  while (gi.hasNext()) {
                      if (!gi.next().getValue().target.startsWith("p:")) gi.remove();
                  }
                  dbg("novo mundo (epoca " + epoch + ")");
              }

              /** O contador de ids deste aparelho recomeca no mesmo numero do servidor, entao um mob criado so aqui pode receber o id de uma entidade que JA existe
               *  (ovelha, zumbi, jogador...). O jogo acha entidades por id: o mod passa a mexer na entidade errada e o mob novo fica inalcancavel (sem modelo).
               *  Antes do spawn real, criamos "queimadores" longe do mundo (y=-200) ate o proximo id livre. */
              static void burnIds(float x, float z) {
                  if (preSpawn == null || !onDef("queimarids", true)) return;
                  try {
                      if (spawnM == null) {
                          spawnM = Class.forName(SM).getDeclaredMethod("nativeSpawnEntity", float.class, float.class, float.class, int.class, String.class);
                          spawnM.setAccessible(true);
                      }
                      if (lastLocalId == NONE) {
                          long b = ((Long) spawnM.invoke(null, Float.valueOf(x), Float.valueOf(-200f), Float.valueOf(z), Integer.valueOf(12), null)).longValue(); // sonda: descobre onde esta o contador
                          discardBurner(b);
                          lastLocalId = b;
                          burned++;
                      }
                      int guard = 0;
                      while (guard < 150 && preSpawn.contains(Long.valueOf(lastLocalId + 1))) {
                          long b = ((Long) spawnM.invoke(null, Float.valueOf(x), Float.valueOf(-200f), Float.valueOf(z), Integer.valueOf(12), null)).longValue();
                          discardBurner(b);
                          lastLocalId = b;
                          guard++;
                          burned++;
                      }
                      if (guard > 0) {
                          bump("ids-queimados");
                          dbgN("queimar", "ids ocupados por outras entidades: queimei " + guard + " para o proximo mob local ficar com id livre (ultimo=" + lastLocalId + ")", 30);
                      }
                  } catch (Throwable t) {
                      log("burnIds", t);
                  }
              }

              static void discardBurner(long b) {
                  try {
                      if (preSpawn != null && preSpawn.contains(Long.valueOf(b))) return; // id repetido: remover por id atingiria a entidade original; o vazio elimina
                      smCall("nativeRemoveEntity", Long.valueOf(b));
                  } catch (Throwable t) { }
              }

              static void spawnArgs(float x, float y, float z, int type, String skin) {
                  pX = x; pY = y; pZ = z; pType = type; pSkin = skin;
                  preSpawn = null;
                  try {
                      if (isRemote()) {
                          HashSet<Long> h = new HashSet<Long>();
                          if (allEntities == null) allEntities = Class.forName(SM).getField("allentities");
                          List<?> l = (List<?>) allEntities.get(null);
                          if (l != null) for (Object o : new ArrayList<Object>(l)) h.add((Long) o);
                          if (allPlayers == null) allPlayers = Class.forName(SM).getField("allplayers");
                          List<?> ap = (List<?>) allPlayers.get(null);
                          if (ap != null) for (Object o : new ArrayList<Object>(ap)) h.add((Long) o);
                          long me = playerEnt();
                          if (me != NONE) h.add(Long.valueOf(me));
                          preSpawn = h;
                          burnIds(x, z);
                      }
                  } catch (Throwable t) { }
              }

              /** Chamado depois de nativeSpawnEntity. Num mundo de outro host, o mob existe so aqui: avisa os outros para criarem um "fantasma". */
              static void spawned(long id) throws Exception {
                  if (replaying || id == 0 || id == -1 || !on("ghosts") || !on("master")) return;
                  bump("hook:spawn");
                  if (!isRemote()) {
                      bump("spawn:servidor");
                      tr("SPAWN", "mob no mundo do servidor id=" + id + " tipo=" + pType + " skin=" + pSkin, 30);
                      return;
                  }
                  Own o = new Own();
                  o.type = pType;
                  o.skin = pSkin == null ? "" : pSkin;
                  o.born = tickN;
                  o.x = pX; o.y = pY; o.z = pZ;
                  own.put(Long.valueOf(id), o);
                  lastLocalId = id;
                  boolean col = false;
                  String com = "";
                  try {
                      long me = playerEnt();
                      if (id == me) { col = true; com = "o PROPRIO jogador"; }
                      else if (preSpawn != null && preSpawn.contains(Long.valueOf(id))) { col = true; com = isKnownPlayer(id) ? "outro jogador" : "uma entidade do servidor"; }
                  } catch (Throwable t) { }
                  preSpawn = null;
                  if (col) {
                      collided.add(Long.valueOf(id));
                      bump("colisao-de-id");
                      dbgN("colisao", "COLISAO DE ID: mob local id=" + id + " tem o mesmo id de " + com + ". O jogo guarda modelo/skin por id: sem protecao o modelo do mob iria para essa entidade", 40);
                  }
                  broadcast(gsMsg(id, o));
                  tr("SPAWN", "mob SO LOCAL (mundo de outro host) id=" + id + " tipo=" + o.type + " skin=" + o.skin + " pos=" + o.x + "," + o.y + "," + o.z + " -> fantasma sera pedido", 60);
              }

              static void removed(long id) throws Exception {
                  if (own.containsKey(Long.valueOf(id))) {
                      tr("REMOVE", "mob local removido id=" + id, 60);
                      removeOwn(id);
                  }
              }

              static void removeOwn(long id) throws Exception {
                  own.remove(Long.valueOf(id));
                  collided.remove(Long.valueOf(id));
                  restoreQ.remove(Long.valueOf(id));
                  JSONObject j = new JSONObject();
                  j.put("t", "gr");
                  j.put("id", String.valueOf(id));
                  broadcast(j.toString());
                  synchronized (lock) { ents.remove("o:" + id); }
              }

              static void particle(int type, float x, float y, float z, float vx, float vy, float vz, int size) {
                  if (replaying || peers.isEmpty() || !on("particles")) return;
                  if (pq.size() >= 200) return;
                  bump("hook:particula");
                  pq.add(new double[] { type, x, y, z, vx, vy, vz, size });
              }

