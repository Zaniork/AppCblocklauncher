              static void broadcast(String line) {
                  synchronized (peers) {
                      for (int i = 0; i < peers.size(); i++) {
                          Peer p = peers.get(i);
                          if (p.out.size() < 50000) p.out.offer(line);
                      }
                  }
              }

              /** Roda em thread de rede. Copia o estado rapido sob o lock e monta o texto fora dele (nao trava o jogo). */
              static void sendSnapshot(Peer p) {
                  try {
                      ArrayList<Integer> rids = new ArrayList<Integer>();
                      ArrayList<ArrayList<JSONArray>> rops = new ArrayList<ArrayList<JSONArray>>();
                      ArrayList<JSONArray> items = new ArrayList<JSONArray>();
                      ArrayList<JSONArray> crea = new ArrayList<JSONArray>();
                      ArrayList<Object[]> es = new ArrayList<Object[]>();
                      synchronized (lock) {
                          for (Map.Entry<Integer, ArrayList<JSONArray>> en : rdefs.entrySet()) {
                              rids.add(en.getKey());
                              rops.add(new ArrayList<JSONArray>(en.getValue()));
                          }
                          for (ArrayList<JSONArray> l : itemOps.values()) items.addAll(l);
                          crea.addAll(creativeList);
                          for (Map.Entry<String, EntState> en : ents.entrySet()) {
                              for (Map.Entry<String, JSONArray> kv : en.getValue().m.entrySet()) {
                                  es.add(new Object[] { en.getKey(), kv.getKey(), kv.getValue(), Integer.valueOf(en.getValue().ty), Long.valueOf(en.getValue().pid) });
                              }
                          }
                      }
                      for (int i = 0; i < rids.size(); i++) {
                          int rid = rids.get(i).intValue();
                          p.out.offer(rMsg(rid));
                          for (JSONArray op : rops.get(i)) p.out.offer(oMsg(rid, op));
                      }
                      for (JSONArray op : items) p.out.offer(iMsg(op));
                      for (JSONArray a : crea) p.out.offer(cMsg(a));
                      for (Object[] e : es) p.out.offer(eMsg((String) e[0], (String) e[1], (JSONArray) e[2], ((Integer) e[3]).intValue(), ((Long) e[4]).longValue()));
                      snapQ.add(p); // mobs locais (fantasmas) sao enviados pela thread do jogo
                  } catch (Throwable t) {
                      log("snapshot", t);
                  }
              }

              // ------------------------------------------------------------------ tick (thread do jogo)

              static void tick() {
                  long tk0 = System.nanoTime();
                  try {
                      tick0();
                  } finally {
                      long dt = System.nanoTime() - tk0;
                      tickNsSum += dt;
                      tickCount++;
                      if (dt > tickNsMax) tickNsMax = dt;
                      if (dt > 30000000L) tr("LENTO", "tick demorou " + (dt / 1000000L) + "ms inbox=" + inbox.size(), 5);
                  }
              }

              static void tick0() {
                  tickN++;
                  if (!started) {
                      started = true;
                      startSession();
                      startNet();
                  }
                  if (!on("master")) return;
                  boolean rdy = ready();
                  if (rdy) {
                      int n = 0;
                      long t0 = System.nanoTime();
                      Msg m;
                      while ((m = inbox.poll()) != null) {
                          try {
                              handle(m);
                          } catch (Throwable t) {
                              log("handle", t);
                          }
                          n++;
                          if (n >= 400 || System.nanoTime() - t0 > 6000000L) break;
                      }
                  } else if (tickN % 200 == 0 && !inbox.isEmpty()) {
                      dbgN("naopronto", "mundo/jogador ainda nao pronto: " + inbox.size() + " mensagens aguardando", 10);
                  }
                  if (!rdy) return;
                  try { pollGone(); } catch (Throwable t) { log("gone", t); }
                  try { pollSnap(); } catch (Throwable t) { log("snap", t); }
                  if (tickN % 2 == 0) { try { pollOwn(); } catch (Throwable t) { log("pollOwn", t); } }
                  if (!restoreQ.isEmpty()) { try { restoreCollided(); } catch (Throwable t) { log("restore", t); } }
                  if (tickN % 4 == 0) { try { pollHand(); } catch (Throwable t) { log("pollHand", t); } }
                  if (tickN % 20 == 5) { try { pollOther(); } catch (Throwable t) { log("pollOther", t); } }
                  try { flushParticles(); } catch (Throwable t) { log("particles", t); }
                  if (tickN % 20 == 0) reapply();
                  if (tickN % 20 == 10) { try { hideGhosts(); } catch (Throwable t) { log("hide", t); } }
                  if (tickN % 200 == 0) prune();
                  if (tickN % 600 == 0 || tickN == 100) status();
              }

              static void pollGone() throws Exception {
                  String pid;
                  while ((pid = goneQ.poll()) != null) {
                      String prefix = pid + ":";
                      for (String key : new ArrayList<String>(gmap.keySet())) {
                          if (key.startsWith(prefix)) {
                              Long g = gmap.remove(key);
                              if (g != null && present(g.longValue())) smCall("nativeRemoveEntity", g);
                          }
                      }
                  }
              }

              /** Aparelho saiu (ou reconectou): esquece TUDO que ele tinha aplicado. Antes os grupos antigos ficavam e, a cada 5s,
               *  reaplicavam o modelo velho (ex.: Freeza) por cima do novo (Goku). */
              static void purgePeer(String pid) {
                  int n = 0;
                  try {
                      for (Map.Entry<String, Group> en : new ArrayList<Map.Entry<String, Group>>(remote.entrySet())) {
                          if (en.getValue().peer.equals(pid)) { remote.remove(en.getKey()); n++; }
                      }
                      String prefix = pid + ":";
                      for (String key : new ArrayList<String>(gmap.keySet())) {
                          if (key.startsWith(prefix)) {
                              Long g = gmap.remove(key);
                              if (g != null && present(g.longValue())) smCall("nativeRemoveEntity", g);
                          }
                      }
                  } catch (Throwable t) {
                      log("purgePeer", t);
                  }
                  dbg("limpeza do aparelho " + pid + ": " + n + " grupos de aparencia descartados");
              }

              /** Marca o render deste aparelho para ser aplicado de novo (o modelo dele foi redefinido). */
              static void markRenderDirty(String pid) {
                  for (Group g : new ArrayList<Group>(remote.values())) {
                      if (!g.peer.equals(pid)) continue;
                      Remote r = g.m.get("render");
                      if (r != null) { r.done = false; r.tries = 0; }
                  }
              }

              static void clearRenderer(int lid) {
                  String[] parts = { "head", "hat", "body", "rightArm", "leftArm", "rightLeg", "leftLeg" };
                  for (String p : parts) {
                      try {
                          Object ex = rmCall("nativeModelPartExists", Integer.valueOf(lid), p);
                          if (ex instanceof Boolean && ((Boolean) ex).booleanValue()) rmCall("nativeModelClear", Integer.valueOf(lid), p);
                      } catch (Throwable t) { }
                  }
              }
              /** Um mob local (ex.: kamehameha) dividiu o id com um jogador e o nativo gravou o modelo/skin do mob nele. Devolve ao jogador o que era dele. */
              static void restoreCollided() throws Exception {
                  ArrayList<Long> q = new ArrayList<Long>(restoreQ);
                  restoreQ.clear();
                  long me = playerEnt();
                  Class<?> api = Class.forName(SM + "$NativeEntityApi");
                  for (Long id : q) {
                      if (id.longValue() == me) {
                          EntState st;
                          synchronized (lock) { st = ents.get("p:" + playerKey(me)); }
                          if (st == null) continue;
                          replaying = true;
                          try {
                              JSONArray r = st.m.get("render");
                              JSONArray sk = st.m.get("skin");
                              if (r != null) invoke(api, "setRenderTypeImpl", id, Integer.valueOf(r.getInt(0)));
                              if (sk != null) invoke(api, "setMobSkinImpl", id, sk.getString(0), Boolean.FALSE);
                          } finally {
                              replaying = false;
                          }
                          bump("colisao:jogador-restaurado");
                          dbgN("restaura", "modelo do PROPRIO jogador restaurado (id " + id + " dividido com mob local)", 30);
                      } else {
                          boolean any = false;
                          for (Group g : new ArrayList<Group>(remote.values())) {
                              if (!g.target.startsWith("p:") || g.pid != id.longValue()) continue;
                              for (Remote r : g.m.values()) { r.done = false; r.tries = 0; }
                              for (Map.Entry<String, Remote> en : new ArrayList<Map.Entry<String, Remote>>(g.m.entrySet())) tryApply(g, en.getKey(), en.getValue());
                              any = true;
                          }
                          if (any) {
                              bump("colisao:remoto-restaurado");
                              dbgN("restaura2", "modelo do jogador remoto restaurado (id " + id + " dividido com mob local)", 30);
                          }
                          if (!any) {
                              // entidade qualquer do servidor (ovelha, zumbi...): devolve o modelo/skin que ela tinha antes da colisao
                              Object[] sv = saved.get(id);
                              if (sv != null) {
                                  replaying = true;
                                  try {
                                      if (sv[0] instanceof Integer && ((Integer) sv[0]).intValue() > 0) invoke(api, "setRenderTypeImpl", id, sv[0]);
                                      if (sv[1] instanceof String && ((String) sv[1]).length() > 0) invoke(api, "setMobSkinImpl", id, sv[1], Boolean.FALSE);
                                  } finally {
                                      replaying = false;
                                  }
                                  bump("colisao:entidade-restaurada");
                                  dbgN("restaura3", "entidade " + id + " (dividia id com mob local) restaurada: render=" + sv[0] + " skin=" + sv[1], 30);
                              }
                          }
                      }
                  }
              }
              static void pollSnap() throws Exception {
                  Peer p;
                  while ((p = snapQ.poll()) != null) {
                      for (Map.Entry<Long, Own> en : new ArrayList<Map.Entry<Long, Own>>(own.entrySet())) {
                          p.out.offer(gsMsg(en.getKey().longValue(), en.getValue()));
                      }
                  }
              }

              static void pollOwn() throws Exception {
                  if (own.isEmpty()) return;
                  for (Long id : new ArrayList<Long>(own.keySet())) {
                      Own o = own.get(id);
                      if (o == null) continue;
                      if (collided.contains(id)) {
                          // posicao/presenca por este id pertencem a OUTRA entidade (o jogador): o fantasma seguiria o jogador. So o hook de remocao ou o tempo encerra.
                          if (tickN - o.born > 1200) removeOwn(id.longValue());
                          continue;
                      }
                      if (present(id.longValue())) {
                          o.seen = true;
                      } else {
                          if (o.seen || tickN - o.born > 600) removeOwn(id.longValue());
                          continue;
                      }
                      float x = ((Float) smCall("nativeGetEntityLoc", id, Integer.valueOf(0))).floatValue();
                      float y = ((Float) smCall("nativeGetEntityLoc", id, Integer.valueOf(1))).floatValue();
                      float z = ((Float) smCall("nativeGetEntityLoc", id, Integer.valueOf(2))).floatValue();
                      float yaw = ((Float) smCall("nativeGetYaw", id)).floatValue();
                      float pitch = ((Float) smCall("nativeGetPitch", id)).floatValue();
                      if (Math.abs(x - o.x) > 0.03f || Math.abs(y - o.y) > 0.03f || Math.abs(z - o.z) > 0.03f
                              || Math.abs(yaw - o.yaw) > 1f || Math.abs(pitch - o.pitch) > 1f) {
                          o.x = x; o.y = y; o.z = z; o.yaw = yaw; o.pitch = pitch;
                          broadcast(gpMsg(id.longValue(), o));
                      }
                  }
              }

              static void pollHand() throws Exception {
                  if (peers.isEmpty() || !on("hand") || !on("master")) return;
                  long pe = playerEnt();
                  if (pe == NONE || !present(pe)) return;
                  int id = ((Integer) smCall("nativeGetCarriedItem", Integer.valueOf(0))).intValue();
                  if (id <= 0) {
                      if (lastHandId != 0) {
                          lastHandId = 0;
                          tr("MAO", "EU estou com a mao vazia", 30);
                      }
                      return;
                  }
                  int dmg = ((Integer) smCall("nativeGetCarriedItem", Integer.valueOf(1))).intValue();
                  int cnt = ((Integer) smCall("nativeGetCarriedItem", Integer.valueOf(2))).intValue();
                  if (id != lastHandId) {
                      lastHandId = id;
                      tr("MAO", "EU seguro item id=" + id + " dmg=" + dmg + " qtd=" + cnt + " peers=" + peers.size(), 30);
                  }
                  JSONArray a = new JSONArray();
                  a.put(id);
                  a.put(cnt);
                  a.put(dmg);
                  onEnt(pe, "hand", a);
              }

              static void flushParticles() throws Exception {
                  if (pq.isEmpty()) return;
                  JSONArray arr = new JSONArray();
                  for (double[] d : pq) {
                      JSONArray a = new JSONArray();
                      for (double v : d) a.put(v);
                      arr.put(a);
                  }
                  pq.clear();
                  JSONObject j = new JSONObject();
                  j.put("t", "p");
                  j.put("a", arr);
                  broadcast(j.toString());
              }

              static void hideGhosts() throws Exception {
                  if (myGhosts.isEmpty()) return;
                  for (Long g : new ArrayList<Long>(myGhosts)) {
                      if (hidden.contains(g) || !present(g.longValue())) continue;
                      if (g.longValue() == playerEnt() || isPlayer(g.longValue())) { myGhosts.remove(g); dbg("fantasma " + g + " era jogador: nao escondido"); continue; }
                      int rid = ensureInvis();
                      smCall("nativeSetEntityRenderType", g, Integer.valueOf(rid));
                      hidden.add(g);
                      dbg("fantasma " + g + " escondido para o dono");
                  }
              }

              static int ensureInvis() throws Exception {
                  if (invisRid > 0) return invisRid;
                  int rid = ((Integer) rmCall("nativeCreateHumanoidRenderer")).intValue();
                  String[] parts = { "head", "hat", "body", "rightArm", "leftArm", "rightLeg", "leftLeg" };
                  for (String p : parts) {
                      try {
                          Object ex = rmCall("nativeModelPartExists", Integer.valueOf(rid), p);
                          if (ex instanceof Boolean && ((Boolean) ex).booleanValue()) rmCall("nativeModelClear", Integer.valueOf(rid), p);
                      } catch (Throwable t) { }
                  }
                  invisRid = rid;
                  return rid;
              }

              // ------------------------------------------------------------------ mensagens recebidas

              static void handle(Msg m) throws Exception {
                  JSONObject j = m.j;
                  String t = j.getString("t");
                  String pid = m.p.id;
                  bump("rx-msg:" + t);
                  if (t.equals("bye")) { purgePeer(pid); return; }
                  if (m.p.dead) return; // mensagem que ficou na fila de um aparelho que ja saiu
                  if (t.equals("e") || t.equals("gs") || t.equals("gr") || t.equals("gm") || t.equals("i") || t.equals("c")) {
                      tr("RX", "de " + pid + ": " + cut(j.toString(), 260), 60);
                  }
                  if (t.equals("r")) {
                      String key = pid + ":" + j.getInt("rid");
                      Integer old = rmap.get(key);
                      int ridN = j.getInt("rid");
                      Integer mn = minRid.get(pid);
                      if (mn == null || ridN < mn.intValue()) minRid.put(pid, Integer.valueOf(ridN));
                      if (old != null) {
                          // o remetente redefiniu este renderizador (entrou de novo no mundo / recarregou o mod): limpa o modelo antigo e recebe o novo
                          crumb("redefinir renderizador " + key);
                          clearRenderer(old.intValue());
                          bump("r:redefinido");
                          dbgN("rredef", "renderizador " + key + " redefinido pelo remetente: modelo antigo limpo", 30);
                      } else {
                          crumb("criar renderizador " + key);
                          Object lid = rmCall("nativeCreateHumanoidRenderer");
                          rmap.put(key, (Integer) lid);
                      }
                      m.p.fresh.add(key);
                      markRenderDirty(pid);
                  } else if (t.equals("o")) {
                      String key = pid + ":" + j.getInt("rid");
                      if (!m.p.fresh.contains(key)) return;
                      Integer lid = rmap.get(key);
                      if (lid == null) return;
                      JSONArray op = j.getJSONArray("op");
                      String o = op.getString(0);
                      if ((rxOps++ & 31) == 0) crumb("modelo " + key + " " + o);
                      if (o.equals("box")) {
                          rmCall("nativeModelAddBox", lid, op.getString(1),
                                  Float.valueOf((float) op.getDouble(2)), Float.valueOf((float) op.getDouble(3)), Float.valueOf((float) op.getDouble(4)),
                                  Integer.valueOf(op.getInt(5)), Integer.valueOf(op.getInt(6)), Integer.valueOf(op.getInt(7)),
                                  Float.valueOf((float) op.getDouble(8)),
                                  Integer.valueOf(op.getInt(9)), Integer.valueOf(op.getInt(10)),
                                  Boolean.valueOf(op.getBoolean(11)),
                                  Float.valueOf((float) op.getDouble(12)), Float.valueOf((float) op.getDouble(13)));
                      } else if (o.equals("clr")) {
                          rmCall("nativeModelClear", lid, op.getString(1));
                      } else if (o.equals("rot")) {
                          rmCall("nativeModelSetRotationPoint", lid, op.getString(1),
                                  Float.valueOf((float) op.getDouble(2)), Float.valueOf((float) op.getDouble(3)), Float.valueOf((float) op.getDouble(4)));
                      }
                  } else if (t.equals("e")) {
                      String target = j.getString("T");
                      String k = j.getString("k");
                      boolean plr = target.startsWith("p:");
                      if (plr && !on("players")) return;
                      if (!plr && !on("entities")) return;
                      bump("rx:" + k);
                      String gk = pid + "|" + target;
                      Group g = remote.get(gk);
                      if (g == null) {
                          g = new Group();
                          g.peer = pid;
                          g.target = target;
                          remote.put(gk, g);
                      }
                      Remote r = new Remote();
                      r.a = j.getJSONArray("a");
                      r.ty = j.has("ty") ? j.getInt("ty") : 0;
                      r.born = tickN;
                      g.m.put(k, r);
                      if (j.has("pid")) g.pid = Long.parseLong(j.getString("pid"));
                      tryApply(g, k, r);
                  } else if (t.equals("i")) {
                      if (on("items")) itemApply(j.getJSONArray("op"));
                  } else if (t.equals("c")) {
                      if (on("items")) creativeApply(j.getJSONArray("a"));
                  } else if (t.equals("gs")) {
                      ghostSpawn(m, j);
                  } else if (t.equals("gp")) {
                      Long gid = gmap.get(pid + ":" + j.getString("id"));
                      if (gid == null || !present(gid.longValue())) return;
                      smCall("nativeSetPosition", gid, Float.valueOf((float) j.getDouble("x")), Float.valueOf((float) j.getDouble("y")), Float.valueOf((float) j.getDouble("z")));
                      smCall("nativeSetRot", gid, Float.valueOf((float) j.getDouble("yw")), Float.valueOf((float) j.getDouble("pt")));
                  } else if (t.equals("gr")) {
                      Long gid = gmap.remove(pid + ":" + j.getString("id"));
                      if (gid != null && present(gid.longValue())) smCall("nativeRemoveEntity", gid);
                      remote.remove(pid + "|o:" + j.getString("id")); // acabou o mob: nao fica tentando aplicar modelo em alvo que nao existe mais
                  } else if (t.equals("gm")) {
                      myGhosts.add(Long.valueOf(Long.parseLong(j.getString("gid"))));
                  } else if (t.equals("p")) {
                      if (!on("particles")) return;
                      JSONArray arr = j.getJSONArray("a");
                      int cnt = arr.length();
                      if (cnt > 100) cnt = 100;
                      for (int i = 0; i < cnt; i++) {
                          JSONArray a = arr.getJSONArray(i);
                          smCall("nativeLevelAddParticle", Integer.valueOf((int) a.getDouble(0)),
                                  Float.valueOf((float) a.getDouble(1)), Float.valueOf((float) a.getDouble(2)), Float.valueOf((float) a.getDouble(3)),
                                  Float.valueOf((float) a.getDouble(4)), Float.valueOf((float) a.getDouble(5)), Float.valueOf((float) a.getDouble(6)),
                                  Integer.valueOf((int) a.getDouble(7)));
                      }
                  }
              }

              static boolean validItem(int id) {
                  try { return ((Boolean) smCall("nativeIsValidItem", Integer.valueOf(id))).booleanValue(); } catch (Throwable t) { return true; }
              }

              /** Mesma checagem que o ModPE.setItem faz antes de definir um item (icone inexistente derruba o jogo). */
              static boolean hasIcon(String icon, int sub) {
                  try {
                      java.lang.reflect.Field f = Class.forName(SM).getDeclaredField("itemsMeta");
                      f.setAccessible(true);
                      Object meta = f.get(null);
                      if (meta == null) return true;
                      Method m = meta.getClass().getMethod("hasIcon", String.class, int.class);
                      return ((Boolean) m.invoke(meta, icon, Integer.valueOf(sub))).booleanValue();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              static Object[] coerce(Method m, JSONArray op, int from) throws Exception {
                  Class<?>[] pt = m.getParameterTypes();
                  Object[] out = new Object[pt.length];
                  for (int i = 0; i < pt.length; i++) {
                      int k = from + i;
                      if (pt[i] == int.class) out[i] = Integer.valueOf(op.getInt(k));
                      else if (pt[i] == boolean.class) out[i] = Boolean.valueOf(op.getBoolean(k));
                      else if (pt[i] == String.class) out[i] = op.getString(k);
                      else if (pt[i] == float.class) out[i] = Float.valueOf((float) op.getDouble(k));
                      else throw new Exception("tipo nao suportado " + pt[i]);
                  }
                  return out;
              }

              /** Replica a definicao de um item de mod (id, icone, nome, 3D na mao, propriedades) para quem nao tem o mod. */
              static void itemApply(JSONArray op) throws Exception {
                  String name = op.getString(0);
                  int id = op.getInt(1);
                  boolean def = name.equals("nativeDefineItem") || name.equals("nativeDefineSnowballItem") || name.equals("nativeDefineArmor");
                  if (def) {
                      if (remoteItems.contains(Integer.valueOf(id))) return;
                      synchronized (lock) { if (itemOps.containsKey(Integer.valueOf(id))) return; } // meu proprio mod ja definiu
                      if (validItem(id)) return;
                      String icon = op.getString(2);
                      int sub = op.getInt(3);
                      if (!hasIcon(icon, sub)) {
                          dbgN("icone", "item " + id + ": icone ausente " + icon + ":" + sub + " (instale o mesmo mod/texturas)", 20);
                          return;
                      }
                      remoteItems.add(Integer.valueOf(id));
                      dbgN("item", "definindo item remoto " + id + " (" + name + ")", 40);
                  } else if (!remoteItems.contains(Integer.valueOf(id))) {
                      return;
                  }
                  crumb("item " + id + " " + name);
                  Method m = find(Class.forName(SM), name, op.length() - 1);
                  try {
                      m.invoke(null, coerce(m, op, 1));
                  } catch (InvocationTargetException ite) {
                      throw new Exception(String.valueOf(ite.getCause()));
                  }
              }

              static void creativeApply(JSONArray a) throws Exception {
                  int id = a.getInt(0);
                  int count = a.getInt(1);
                  int dmg = a.getInt(2);
                  String key = id + ":" + dmg;
                  if (creativeApplied.contains(key)) return;
                  if (!validItem(id)) return;
                  creativeApplied.add(key);
                  smCall("nativeAddItemCreativeInv", Integer.valueOf(id), Integer.valueOf(count), Integer.valueOf(dmg));
                  dbgN("criativo", "item " + id + " adicionado ao criativo", 40);
              }

              /** Recebido de quem entrou na LAN: cria no meu mundo (que e o servidor) um mob de verdade que espelha o dele. */
              static void ghostSpawn(Msg m, JSONObject j) throws Exception {
                  if (!on("ghosts") || isRemote()) return; // so quem hospeda pode criar entidades de servidor
                  String key = m.p.id + ":" + j.getString("id");
                  if (gmap.containsKey(key)) return;
                  String sk = j.getString("sk");
                  crumb("fantasma " + key);
                  Object r = smCall("spawnEntityImpl", Float.valueOf((float) j.getDouble("x")), Float.valueOf((float) j.getDouble("y")),
                          Float.valueOf((float) j.getDouble("z")), Integer.valueOf(j.getInt("ty")), sk.length() == 0 ? null : sk);
                  long gid = ((Long) r).longValue();
                  if (gid == 0 || gid == -1) return;
                  gmap.put(key, Long.valueOf(gid));
                  try { smCall("nativeEntitySetImmobile", Long.valueOf(gid), Boolean.TRUE); } catch (Throwable t) { }
                  JSONObject re = new JSONObject();
                  re.put("t", "gm");
                  re.put("id", j.getString("id"));
                  re.put("gid", String.valueOf(gid));
                  m.p.out.offer(re.toString());
                  dbg("fantasma criado " + key + " -> " + gid);
              }

              static void reapply() {
                  try {
                      for (Group g : new ArrayList<Group>(remote.values())) {
                          boolean refresh = g.target.startsWith("p:") && tickN % 100 == 0;
                          for (Map.Entry<String, Remote> en : new ArrayList<Map.Entry<String, Remote>>(g.m.entrySet())) {
                              Remote r = en.getValue();
                              if (refresh) { r.done = false; r.tries = 0; }
                              if (r.done && !g.target.startsWith("p:")) {
                                  long rid2 = resolve(g);
                                  if (rid2 == NONE || !present(rid2)) r.done = false; // sumiu: aplica de novo quando voltar
                              }
                              if (!r.done) tryApply(g, en.getKey(), r);
                          }
                      }
                  } catch (Throwable t) {
                      log("reapply", t);
                  }
              }

              static long resolve(Group g) {
                  String t = g.target;
                  try {
                      if (t.startsWith("e:")) return Long.parseLong(t.substring(2));
                      if (t.startsWith("o:")) {
                          Long x = gmap.get(g.peer + ":" + t.substring(2));
                          return x == null ? NONE : x.longValue();
                      }
                      if (t.startsWith("p:")) return resolvePlayer(t.substring(2), g.pid);
                  } catch (Throwable e) { }
                  return NONE;
              }

              /** Acha a entidade do OUTRO jogador. Nunca devolve o proprio jogador (era o que fazia o personagem sumir). */
              static long resolvePlayer(String key, long pid) {
                  try {
                      long me = playerEnt();
                      // o launcher de quem hospeda NAO registra o jogador que entrou; o id informado por ele e confiavel
                      if (pid != NONE && pid != me) {
                          int pty = typeOf(pid);
                          if (pty == 63) {
                              trResolve(key, pid, "id informado pelo remetente (tipo 63 = jogador)");
                              return pid;
                          }
                          trResolve(key + "#pid", pid, "id informado NAO e jogador neste mundo (tipo=" + pty + ")");
                      }
                      if (allPlayers == null) allPlayers = Class.forName(SM).getField("allplayers");
                      List<?> ap = (List<?>) allPlayers.get(null);
                      if (ap == null) {
                          trResolve(key, NONE, "allplayers nulo");
                          return NONE;
                      }
                      LinkedHashSet<Long> cand = new LinkedHashSet<Long>(); // sem repetidos (a lista do launcher repete o host)
                      for (Object o : new ArrayList<Object>(ap)) {
                          long id = ((Long) o).longValue();
                          if (id == me || !present(id)) continue;
                          cand.add(Long.valueOf(id));
                      }
                      if (cand.isEmpty()) {
                          // plano B: o jogador remoto pode nao estar em allplayers; procura entre todas as entidades
                          if (allEntities == null) allEntities = Class.forName(SM).getField("allentities");
                          List<?> all = (List<?>) allEntities.get(null);
                          if (all != null) {
                              for (Object o : new ArrayList<Object>(all)) {
                                  long id = ((Long) o).longValue();
                                  if (id == me) continue;
                                  if (isPlayer(id) || typeOf(id) == 63) cand.add(Long.valueOf(id));
                              }
                          }
                          if (cand.isEmpty()) {
                              trResolve(key, NONE, "nenhum outro jogador visivel. allplayers=" + ap + " eu=" + me + " pid_informado=" + pid);
                              dbgEvery("semjogador", 300, "nenhum outro jogador visivel. allplayers=" + ap + " eu=" + me + " pid_informado=" + pid);
                              return NONE;
                          }
                      }
                      if (cand.size() == 1) {
                          long c = cand.iterator().next().longValue();
                          trResolve(key, c, "unico candidato (allplayers/allentities)");
                          return c;
                      }
                      for (Long id : cand) {
                          if (key.equals(playerKey(id.longValue()))) {
                              trResolve(key, id.longValue(), "casou pela chave");
                              return id.longValue();
                          }
                      }
                      trResolve(key, NONE, "varios candidatos " + cand + " e nenhum casou");
                  } catch (Throwable t) {
                      log("resolvePlayer", t);
                  }
                  return NONE;
              }

              static void tryApply(Group g, String k, Remote r) {
                  if (r.done || r.tries > 100) return;
                  if (!hasPeer(g.peer)) { r.done = true; return; } // aparelho saiu: nunca aplicar dados dele
                  long t0 = System.nanoTime();
                  String tag = g.target + " " + k;
                  try {
                      long id = resolve(g);
                      boolean isP = g.target.startsWith("p:");
                      boolean pres = id != NONE && present(id);
                      if (id == NONE || (!pres && !isP)) {
                          bump("sem-alvo:" + k);
                          tr("APLICAR", "SEM ALVO " + tag + " id_resolvido=" + (id == NONE ? "nenhum" : String.valueOf(id)) + " presente_na_lista=" + pres + " pid_do_remetente=" + g.pid + " tentativas=" + r.tries, 15);
                          dbgEvery("semalvo", 200, "sem alvo ainda para " + g.target + " (" + k + ")");
                          return;
                      }
                      if (g.target.startsWith("e:")) {
                          if (id == playerEnt()) return; // nunca mexe no proprio jogador por id de mob
                          int mine = typeOf(id);
                          if (mine == 63 || isPlayer(id) || isKnownPlayer(id)) {
                              // o id do mob (ex.: kamehameha) caiu numa entidade que e JOGADOR neste aparelho: ids de aparelhos diferentes podem coincidir
                              r.tries++;
                              bump("mob-em-jogador-bloqueado");
                              tr("APLICAR", "BLOQUEADO (modelo de mob iria para um jogador) " + tag + " id=" + id + " tipo_local=" + mine, 20);
                              return;
                          }
                          if (mine <= 0 || (r.ty > 0 && mine != r.ty)) {
                              r.tries++;
                              bump("tipo-diferente");
                              tr("APLICAR", "IGNORADO (tipo diferente/desconhecido) " + tag + " id=" + id + " tipo_remoto=" + r.ty + " tipo_local=" + mine, 20);
                              return;
                          }
                      }
                      crumb("aplicar " + g.target + " " + k + " em " + id);
                      curTries = r.tries;
                      boolean ok = apply(id, k, r.a, g.peer);
                      long ms = (System.nanoTime() - t0) / 1000000L;
                      tr("APLICAR", (ok ? "OK " : "FALHOU ") + tag + " id=" + id + " presente_na_lista=" + pres + " tipo_local=" + typeOf(id) + " dados=" + r.a + " " + ms + "ms tentativas=" + r.tries, 40);
                      if (ok) {
                          r.done = true;
                          bump("ok:" + k + (isP ? ":jogador" : ":mob"));
                          if (!toastedApply) {
                              toastedApply = true;
                              toast("ModSync: aparência sincronizada com sucesso");
                          }
                      } else {
                          r.tries++;
                          bump("falta:" + k);
                      }
                  } catch (Throwable t) {
                      r.tries++;
                      bump("erro:" + k);
                      tr("APLICAR", "ERRO " + tag + ": " + stack(t), 20);
                      log("apply " + k, t);
                  }
              }

              static boolean apply(long e, String k, JSONArray a, String peerId) throws Exception {
                  Class<?> api = Class.forName(SM + "$NativeEntityApi");
                  Long ent = Long.valueOf(e);
                  replaying = true;
                  try {
                      if (k.equals("render")) {
                          int r = a.getInt(0);
                          Integer lid = rmap.get(peerId + ":" + r);
                          if (lid == null) {
                              if (r >= 4096) return false;
                              // so usa o id local (modelo padrao do jogo) se o outro aparelho nao tem esse id como modelo de mod;
                              // antes qualquer id desconhecido virava o modelo local de mesmo numero (outro personagem)
                              Integer mn = minRid.get(peerId);
                              boolean builtin = (mn != null && r < mn.intValue()) || (mn == null && curTries >= 3);
                              if (!builtin) {
                                  dbgN("rfallback", "render " + peerId + ":" + r + " ainda nao definido pelo remetente: NAO uso modelo local de mesmo id", 20);
                                  return false;
                              }
                              lid = Integer.valueOf(r);
                          }
                          invoke(api, "setRenderTypeImpl", ent, lid);
                      } else if (k.equals("skin")) {
                          invoke(api, "setMobSkinImpl", ent, a.getString(0), Boolean.FALSE);
                      } else if (k.equals("carry") || k.equals("hand")) {
                          if (a.getInt(0) <= 0) return true;
                          if (k.equals("hand")) {
                              if (!onDef("handapply", true)) return true;
                              try {
                                  Object cur = smCall("nativeEntityGetCarriedItem", ent, Integer.valueOf(0));
                                  if (cur instanceof Integer && ((Integer) cur).intValue() == a.getInt(0)) {
                                      bump("hand:jogo-ja-mostra"); // o proprio jogo ja sincronizou: nao mexe
                                      return true;
                                  }
                              } catch (Throwable t) { }
                              crumb("item na mao " + a.getInt(0) + " em " + e);
                          }
                          invoke(api, "setCarriedItem", ent, Integer.valueOf(a.getInt(0)), Integer.valueOf(a.getInt(1)), Integer.valueOf(a.getInt(2)));
                      } else if (k.startsWith("armor")) {
                          invoke(api, "setArmor", ent, Integer.valueOf(a.getInt(0)), Integer.valueOf(a.getInt(1)), Integer.valueOf(a.getInt(2)));
                      }
                  } finally {
                      replaying = false;
                  }
                  return true;
              }

              static void prune() {
                  try {
                      synchronized (lock) {
                          ArrayList<String> del = new ArrayList<String>();
                          for (Map.Entry<String, EntState> en : ents.entrySet()) {
                              String t = en.getKey();
                              if (t.startsWith("p:")) continue;
                              if (tickN - en.getValue().born <= 60) continue;
                              if (t.startsWith("e:") && !present(Long.parseLong(t.substring(2)))) del.add(t);
                              else if (t.startsWith("o:") && !own.containsKey(Long.valueOf(Long.parseLong(t.substring(2))))) del.add(t);
                          }
                          for (String s : del) ents.remove(s);
                      }
                      ArrayList<String> del2 = new ArrayList<String>();
                      for (Map.Entry<String, Group> en : remote.entrySet()) {
                          Group g = en.getValue();
                          if (g.target.startsWith("p:")) continue;
                          boolean young = false;
                          for (Remote r : g.m.values()) {
                              if (tickN - r.born < 1200) young = true;
                          }
                          if (!young) del2.add(en.getKey());
                      }
                      for (String s : del2) remote.remove(s);
                  } catch (Throwable t) {
                      log("prune", t);
                  }
              }

              // ------------------------------------------------------------------ rede (LAN)

              static void startNet() {
                  daemon(new Runnable() { public void run() { acceptLoop(); } });
                  daemon(new Runnable() { public void run() { udpRx(); } });
                  daemon(new Runnable() { public void run() { udpTx(); } });
              }

              static void daemon(Runnable r) {
                  Thread t = new Thread(r);
                  t.setDaemon(true);
                  t.start();
              }

              static void acceptLoop() {
                  try {
                      ServerSocket ss = new ServerSocket(PORT);
                      while (true) {
                          final Socket s = ss.accept();
                          daemon(new Runnable() { public void run() { handshake(s); } });
                      }
                  } catch (Throwable t) {
                      log("accept", t);
                  }
              }

              static void handshake(Socket s) {
                  try {
                      s.setSoTimeout(5000);
                      s.setTcpNoDelay(true);
                      s.getOutputStream().write(("ID|" + ID + "\n").getBytes("UTF-8"));
                      s.getOutputStream().flush();
                      BufferedReader br = new BufferedReader(new InputStreamReader(s.getInputStream(), "UTF-8"));
                      String line = br.readLine();
                      if (line == null || !line.startsWith("ID|")) {
                          s.close();
                          return;
                      }
                      String pid = line.substring(3).trim();
                      s.setSoTimeout(0);
                      final Peer p = new Peer(s, pid);
                      Peer antigo = null;
                      synchronized (peers) {
                          for (Peer o : peers) {
                              if (o.id.equals(pid)) { antigo = o; break; }
                          }
                      }
                      if (antigo != null) {
                          dbg("aparelho " + pid + " reconectou: descartando a conexao antiga");
                          antigo.close(); // enfileira o "bye" antes de qualquer mensagem da conexao nova
                      }
                      synchronized (peers) { peers.add(p); }
                      p.start();
                      sendSnapshot(p);
                      tr("REDE", "peer conectado id=" + pid + " remoto=" + s.getRemoteSocketAddress() + " local=" + s.getLocalSocketAddress(), 20);
                      dbg("peer conectado " + pid);
                      toast("ModSync: conectado a outro aparelho");
                  } catch (Throwable t) {
                      try { s.close(); } catch (Throwable x) { }
                      log("handshake", t);
                  }
              }

              static boolean hasPeer(String id) {
                  synchronized (peers) {
                      for (Peer o : peers) if (o.id.equals(id)) return true;
                  }
                  return false;
              }

              static void udpRx() {
                  try {
                      DatagramSocket ds = new DatagramSocket(null);
                      ds.setReuseAddress(true);
                      ds.bind(new InetSocketAddress(PORT));
                      byte[] buf = new byte[256];
                      while (true) {
                          DatagramPacket pk = new DatagramPacket(buf, buf.length);
                          ds.receive(pk);
                          String msg = new String(pk.getData(), 0, pk.getLength(), "UTF-8");
                          String[] parts = msg.split("\\|");
                          if (parts.length < 3 || !parts[0].equals("MSYNC1")) continue;
                          final String id = parts[1];
                          if (!id.equals(ID)) tr("DESCOBERTA", "hello de " + pk.getAddress() + " id=" + id + " ja_conectado=" + hasPeer(id), 2);
                          if (id.equals(ID) || hasPeer(id)) continue;
                          // so um dos lados conecta (o de ID menor), para nao duplicar
                          if (ID.compareTo(id) >= 0) continue;
                          synchronized (connecting) {
                              if (connecting.contains(id)) continue;
                              connecting.add(id);
                          }
                          final InetAddress addr = pk.getAddress();
                          final int port = Integer.parseInt(parts[2].trim());
                          daemon(new Runnable() {
                              public void run() {
                                  try {
                                      Socket s = new Socket();
                                      s.connect(new InetSocketAddress(addr, port), 3000);
                                      handshake(s);
                                  } catch (Throwable t) {
                                      log("connect", t);
                                  }
                                  synchronized (connecting) { connecting.remove(id); }
                              }
                          });
                      }
                  } catch (Throwable t) {
                      log("udpRx", t);
                  }
              }

              static void udpTx() {
                  try {
                      DatagramSocket ds = new DatagramSocket();
                      ds.setBroadcast(true);
                      byte[] data = ("MSYNC1|" + ID + "|" + PORT).getBytes("UTF-8");
                      while (true) {
                          if (peers.isEmpty()) {
                              ArrayList<InetAddress> targets = new ArrayList<InetAddress>();
                              try { targets.add(InetAddress.getByName("255.255.255.255")); } catch (Throwable t) { }
                              try {
                                  Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                                  while (en != null && en.hasMoreElements()) {
                                      NetworkInterface ni = en.nextElement();
                                      if (!ni.isUp() || ni.isLoopback()) continue;
                                      for (InterfaceAddress ia : ni.getInterfaceAddresses()) {
                                          if (ia.getBroadcast() != null) targets.add(ia.getBroadcast());
                                      }
                                  }
                              } catch (Throwable t) { }
                              for (InetAddress a : targets) {
                                  try { ds.send(new DatagramPacket(data, data.length, a, PORT)); } catch (Throwable t) { }
                              }
                              tr("DESCOBERTA", "enviando hello para " + targets, 1);
                          }
                          Thread.sleep(2000);
                      }
                  } catch (Throwable t) {
                      log("udpTx", t);
                  }
              }
          }
