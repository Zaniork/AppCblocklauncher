              static void loadCfg() {
                  try {
                      File d = dir();
                      if (d == null) return;
                      File f = new File(d, "config.txt");
                      if (!f.exists()) {
                          FileOutputStream o = new FileOutputStream(f);
                          o.write(("# 1 = ligado, 0 = desligado (master=0 desliga tudo)\nmaster=1\nplayers=1\nentities=1\nghosts=1\nhand=1\nhandapply=1\nkeepalive=0\nparticles=1\nitems=1\n").getBytes("UTF-8"));
                          o.close();
                          return;
                      }
                      BufferedReader br = new BufferedReader(new FileReader(f));
                      String line;
                      while ((line = br.readLine()) != null) {
                          line = line.trim();
                          if (line.startsWith("#") || line.indexOf('=') < 0) continue;
                          String[] kv = line.split("=", 2);
                          cfg.put(kv[0].trim(), Boolean.valueOf(!kv[1].trim().equals("0")));
                      }
                      br.close();
                  } catch (Throwable t) { }
              }

              static boolean on(String k) {
                  Boolean b = cfg.get(k);
                  return b == null || b.booleanValue();
              }

              static boolean onDef(String k, boolean def) {
                  Boolean b = cfg.get(k);
                  return b == null ? def : b.booleanValue();
              }

              static void bump(String k) {
                  Integer c = counters.get(k);
                  counters.put(k, Integer.valueOf(c == null ? 1 : c.intValue() + 1));
              }

              /** Registra no maximo 'max' vezes cada tipo de mensagem, para nao encher o log. */
              static final HashMap<String, Integer> lastLog = new HashMap<String, Integer>();

              /** Registra no maximo uma vez a cada 'every' ticks (para nao esconder problemas que voltam depois). */
              static void dbgEvery(String key, int every, String s) {
                  Integer l = lastLog.get(key);
                  if (l != null && tickN - l.intValue() < every) return;
                  lastLog.put(key, Integer.valueOf(tickN));
                  dbg(s);
              }

              static void dbgN(String key, String s, int max) {
                  Integer c = limited.get(key);
                  int n = c == null ? 0 : c.intValue();
                  if (n >= max) return;
                  limited.put(key, Integer.valueOf(n + 1));
                  dbg(s);
              }

